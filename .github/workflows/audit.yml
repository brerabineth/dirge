name: audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ocaml-nox

      - name: build
        run: make

      - name: selftest
        run: ./dirge selftest

      - name: fixture census
        run: |
          ./dirge forge fixtures
          check() {
            want=$1; shift
            got=0
            ./dirge "$@" || got=$?
            if [ "$got" -ne "$want" ]; then
              echo "expected exit $want, got $got for: dirge $*"
              exit 1
            fi
          }
          check 0 scan fixtures/01_newsletter.eml
          check 1 scan fixtures/04_ai_template.eml
          check 10 scan fixtures/02_spoofed_bank.eml
          check 10 scan fixtures/03_smuggle.eml
          check 10 scan fixtures/05_macro_docx.eml
          check 10 scan fixtures/06_inflation.eml

      - name: determinism
        run: |
          ./dirge scan fixtures --json > a.json || true
          ./dirge scan fixtures --json > b.json || true
          cmp a.json b.json
